name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build and package
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle found anywhere. Files in the repository:"
            find . -not -path './.git/*' | head -60
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Building in $DIR"
          cd "$DIR"
          gradle build
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$JAR" "$GITHUB_WORKSPACE/out/donorpay-mod.jar.txt"
          cp "$JAR" "$GITHUB_WORKSPACE/out/donorpay-mod.jar"
          cd "$GITHUB_WORKSPACE/out"
          zip donorpay-mod.zip donorpay-mod.jar
          rm donorpay-mod.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            out/donorpay-mod.zip
            out/donorpay-mod.jar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: donorpay-mod
          path: out/donorpay-mod.zip
