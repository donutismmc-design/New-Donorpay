name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: gradle build
      - name: Package
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          mkdir -p out
          cp "$JAR" out/donorpay-mod.jar.txt
          cp "$JAR" out/donorpay-mod.jar
          cd out && zip donorpay-mod.zip donorpay-mod.jar && rm donorpay-mod.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            out/donorpay-mod.zip
            out/donorpay-mod.jar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: donorpay-mod
          path: out/donorpay-mod.zip
